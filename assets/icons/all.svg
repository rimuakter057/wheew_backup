<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
  </defs>

  

  <!-- Car Body -->
  <rect x="360" y="110" width="304" height="700" rx="60" fill="url(#orangeGrad)"/>

  <!-- Windows -->
  <path d="M420 320 Q512 260 604 320 L580 410 Q512 395 444 410 Z" fill="#f2f2f2"/>
  <path d="M450 620 Q512 650 574 620 L590 710 Q512 730 434 710 Z" fill="#f2f2f2"/>

  <!-- Mirrors -->
  <ellipse cx="345" cy="360" rx="25" ry="15" fill="#ff7a00"/>
  <ellipse cx="679" cy="360" rx="25" ry="15" fill="#ff7a00"/>

  <!-- Headlights -->
  <ellipse cx="410" cy="150" rx="35" ry="18" transform="rotate(-35 410 150)" fill="#f2f2f2"/>
  <ellipse cx="614" cy="150" rx="35" ry="18" transform="rotate(35 614 150)" fill="#f2f2f2"/>

  <!-- Bottom lights -->
  <rect x="420" y="760" width="30" height="12" rx="6" fill="#f2f2f2"/>
  <rect x="574" y="760" width="30" height="12" rx="6" fill="#f2f2f2"/>

  <!-- Left parking lines -->
  <polygon points="140,330 180,335 180,610 140,615" fill="#ff7a00"/>
  <polygon points="195,340 235,345 235,600 195,605" fill="#ff7a00"/>
  <polygon points="250,350 290,355 290,590 250,595" fill="#ff7a00"/>

  <!-- Right parking lines -->
  <polygon points="884,330 844,335 844,610 884,615" fill="#ff7a00"/>
  <polygon points="829,340 789,345 789,600 829,605" fill="#ff7a00"/>
  <polygon points="774,350 734,355 734,590 774,595" fill="#ff7a00"/>

  <!-- Arrows -->
  <path d="M330 500 L300 500 L300 485 L280 510 L300 535 L300 520 L330 520 Z" fill="#ff7a00"/>
  <path d="M694 500 L724 500 L724 485 L744 510 L724 535 L724 520 L694 520 Z" fill="#ff7a00"/>

  <!-- Bottom guide -->
  <path d="M500 820 L524 820 L524 850 L545 850 L512 890 L479 850 L500 850 Z" fill="#ff7a00"/>

  <!-- Bottom parking lines -->
  <rect x="415" y="900" width="194" height="36" fill="#ff7a00"/>
  <rect x="405" y="955" width="214" height="36" fill="#ff7a00"/>
  <rect x="395" y="1010" width="234" height="14" fill="#ff7a00"/>
</svg>
