<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 3166.78 3791.08"
     width="400" height="400">
  <defs>
    <style>
      /* 1. Puntatore: flip orizzontale su asse Y */
      .pin {
        transform-origin: 1583.39px 1895.54px;
        animation: flipH 1.2s cubic-bezier(0.4,0,0.2,1) forwards;
      }

      /* 2. Fumetto: pop in con rimbalzo elastico da 1s */
      .fumetto-wrap {
        transform-origin: 1583.39px 1895.54px;
        animation: popIn 0.45s cubic-bezier(0.34,1.56,0.64,1) 1.0s both;
      }

      /* 3. Dot bounce in sequenza, loop da 1.2s */
      .dot1 {
        transform-origin: 1199.03px 1602.25px;
        animation: dotBounce 0.9s cubic-bezier(0.36,0.07,0.19,0.97) 1.2s infinite;
      }
      .dot2 {
        transform-origin: 1600.82px 1580.08px;
        animation: dotBounce 0.9s cubic-bezier(0.36,0.07,0.19,0.97) 1.4s infinite;
      }
      .dot3 {
        transform-origin: 2003.39px 1557.94px;
        animation: dotBounce 0.9s cubic-bezier(0.36,0.07,0.19,0.97) 1.6s infinite;
      }

      @keyframes flipH {
        0%   { transform: scaleX(1);  }
        50%  { transform: scaleX(0);  }
        100% { transform: scaleX(1);  }
      }

      @keyframes popIn {
        0%   { transform: scale(0);    opacity: 0; }
        60%  { transform: scale(1.15); opacity: 1; }
        80%  { transform: scale(0.95); opacity: 1; }
        100% { transform: scale(1);    opacity: 1; }
      }

      @keyframes dotBounce {
        0%,100% { transform: translateY(0px);     }
        25%      { transform: translateY(-220px); }
        50%      { transform: translateY(0px);     }
        65%      { transform: translateY(-74px); }
        80%      { transform: translateY(0px);     }
      }
    </style>
  </defs>

  <!-- Puntatore blu che flippa orizzontalmente -->
